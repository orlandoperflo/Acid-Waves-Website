name: GitHub Pages Preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare static preview
        run: |
          mkdir -p public
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='CNAME' \
            ./ public/

      - name: Deploy preview to gh-pages subdirectory
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true
          enable_jekyll: false

      - name: Comment preview URL on pull request
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = process.env.PR_NUMBER;
            const cnamePath = 'CNAME';
            const customDomain = fs.existsSync(cnamePath)
              ? fs.readFileSync(cnamePath, 'utf8').trim().replace(/^https?:\/\//, '').replace(/\/$/, '')
              : '';
            const previewUrl = customDomain
              ? `https://${customDomain}/pr-${prNumber}/`
              : `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${prNumber}/`;
            const marker = '<!-- acid-waves-pages-preview -->';
            const body = `${marker}\n## GitHub Pages preview\n\nPreview this PR at: ${previewUrl}\n\n_This URL is updated automatically whenever the PR branch changes. If it 404s immediately after a push, wait for the Pages deployment to finish and refresh._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(prNumber),
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(prNumber),
                body,
              });
            }
